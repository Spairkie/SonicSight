<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980">
  <defs>
    <style>
      .t { font-family: Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="978" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.5"/>

  <g class="t">
    <!-- header -->
    <text x="46" y="52" font-size="12" fill="#8a8a8a" letter-spacing="3">FIGURE 1</text>
    <text x="46" y="84" font-size="24" font-weight="600" fill="#1a1a1a">SonicSight — conceptual signal pipeline</text>
    <text x="46" y="108" font-size="14" fill="#5a5a5a">camera frames → motion estimation → vibration waveform → tone measurement</text>
    <g>
      <rect x="800" y="36" width="114" height="26" rx="13" fill="none" stroke="#999" stroke-width="1.5"/>
      <text x="857" y="54" text-anchor="middle" font-size="12" fill="#666" letter-spacing="1.5">CONCEPTUAL</text>
    </g>

    <line x1="46" y1="126" x2="914" y2="126" stroke="#d8d8d8" stroke-width="1"/>

    <!-- spine -->
    <line x1="118" y1="150" x2="118" y2="700" stroke="#c9c9c9" stroke-width="2"/>

    <!-- Stage 1 -->
    <circle cx="118" cy="176" r="17" fill="#1f5fa8"/>
    <text x="118" y="182" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">1</text>
    <text x="152" y="170" font-size="16" font-weight="600" fill="#1a1a1a">Video-only capture</text>
    <text x="152" y="194" font-size="13" fill="#5a5a5a">Camera2 capability probe → CameraX HFR ≥ 120 fps; stabilization and preview disabled</text>
    <text x="152" y="212" font-size="13" fill="#5a5a5a">Camera permission only — no <tspan font-style="italic">RECORD_AUDIO</tspan>, no network</text>
    <g stroke="#999" stroke-width="1.5" fill="none">
      <rect x="752" y="150" width="140" height="96" rx="4"/>
      <rect x="762" y="162" width="52" height="34" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5,3"/>
      <text x="788" y="184" text-anchor="middle" font-size="10" fill="#1f5fa8" stroke="none">ROI</text>
      <line x1="752" y1="214" x2="892" y2="214" stroke="#c9c9c9" stroke-width="1"/>
      <line x1="752" y1="224" x2="892" y2="224" stroke="#c9c9c9" stroke-width="1"/>
      <line x1="752" y1="234" x2="892" y2="234" stroke="#c9c9c9" stroke-width="1"/>
      <text x="822" y="258" text-anchor="middle" font-size="10.5" fill="#8a8a8a" stroke="none">scanlines in ROI</text>
    </g>

    <!-- Stage 2 -->
    <circle cx="118" cy="302" r="17" fill="#1f5fa8"/>
    <text x="118" y="308" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">2</text>
    <text x="152" y="296" font-size="16" font-weight="600" fill="#1a1a1a">Offline decode</text>
    <text x="152" y="320" font-size="13" fill="#5a5a5a"><tspan font-style="italic">MediaExtractor</tspan> + <tspan font-style="italic">MediaCodec</tspan> → CPU-readable YUV frames</text>
    <text x="152" y="338" font-size="13" fill="#5a5a5a">rolling-shutter timebase from SENSOR_ROLLING_SHUTTER_SKEW, when the HAL exposes it</text>
    <g stroke="#999" stroke-width="1.5" fill="none">
      <line x1="752" y1="276" x2="892" y2="276" stroke="#1f5fa8" stroke-width="1"/>
      <line x1="752" y1="292" x2="892" y2="292" stroke="#1f5fa8" stroke-width="1"/>
      <line x1="752" y1="308" x2="892" y2="308" stroke="#1f5fa8" stroke-width="1"/>
      <line x1="752" y1="324" x2="892" y2="324" stroke="#1f5fa8" stroke-width="1"/>
      <line x1="752" y1="340" x2="892" y2="340" stroke="#1f5fa8" stroke-width="1"/>
      <text x="906" y="280" font-size="10.5" fill="#8a8a8a" stroke="none">t₁</text>
      <text x="906" y="312" font-size="10.5" fill="#8a8a8a" stroke="none">t₂</text>
      <text x="906" y="344" font-size="10.5" fill="#8a8a8a" stroke="none">t₃</text>
      <text x="822" y="362" text-anchor="middle" font-size="10.5" fill="#8a8a8a" stroke="none">per-row sample times</text>
    </g>

    <!-- Stage 3 -->
    <circle cx="118" cy="428" r="17" fill="#1f5fa8"/>
    <text x="118" y="434" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">3</text>
    <text x="152" y="422" font-size="16" font-weight="600" fill="#1a1a1a">Scanline motion estimation</text>
    <text x="152" y="446" font-size="13" fill="#5a5a5a">zero-mean normalized cross-correlation + three-point parabolic sub-pixel fit</text>
    <text x="152" y="464" font-size="13" fill="#5a5a5a">each ROI row contributes one displacement sample per frame (<tspan font-style="italic">RowShiftEstimator</tspan>)</text>
    <g stroke="#999" stroke-width="1.5" fill="none">
      <path d="M752,428 q12,-22 24,0 t24,0 t24,0 t24,0 t24,0" stroke="#999"/>
      <path d="M760,448 q12,-22 24,0 t24,0 t24,0 t24,0 t24,0" stroke="#1f5fa8" stroke-width="1.5"/>
      <line x1="764" y1="428" x2="772" y2="448" stroke="#1f5fa8" stroke-width="1"/>
      <polygon points="768,440 780,444 768,452" fill="#1f5fa8" stroke="none"/>
      <text x="822" y="472" text-anchor="middle" font-size="10.5" fill="#8a8a8a" stroke="none">Δx between scanlines</text>
    </g>

    <!-- Stage 4 -->
    <circle cx="118" cy="554" r="17" fill="#1f5fa8"/>
    <text x="118" y="560" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">4</text>
    <text x="152" y="548" font-size="16" font-weight="600" fill="#1a1a1a">Non-uniform timebase → PCM</text>
    <text x="152" y="572" font-size="13" fill="#5a5a5a">linear resample onto a regular clock; frame gaps preserved, never smoothed over</text>
    <text x="152" y="590" font-size="13" fill="#5a5a5a">DC / slow-drift motion removed, waveform normalized (<tspan font-style="italic">SignalConditioner</tspan>)</text>
    <g stroke="#999" stroke-width="1.5" fill="none">
      <circle cx="760" cy="540" r="3.5" fill="#999" stroke="none"/>
      <circle cx="778" cy="556" r="3.5" fill="#999" stroke="none"/>
      <circle cx="800" cy="548" r="3.5" fill="#999" stroke="none"/>
      <circle cx="824" cy="534" r="3.5" fill="#999" stroke="none"/>
      <circle cx="848" cy="556" r="3.5" fill="#999" stroke="none"/>
      <circle cx="872" cy="546" r="3.5" fill="#999" stroke="none"/>
      <path d="M748,586 q16,-28 32,0 t32,0 t32,0 t32,0" stroke="#1f5fa8" stroke-width="1.5"/>
      <text x="810" y="610" text-anchor="middle" font-size="10.5" fill="#8a8a8a" stroke="none">irregular samples → PCM</text>
    </g>

    <!-- Stage 5 -->
    <circle cx="118" cy="680" r="17" fill="#1f5fa8"/>
    <text x="118" y="686" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">5</text>
    <text x="152" y="674" font-size="16" font-weight="600" fill="#1a1a1a">FFT → dominant-frequency measurement</text>
    <text x="152" y="698" font-size="13" fill="#5a5a5a"><tspan font-style="italic">SpectrumAnalyzer</tspan> reports the strongest spectral peak — a measurement, not speech</text>
    <text x="152" y="716" font-size="13" fill="#5a5a5a">artifacts stay on-device: recovered-&lt;ts&gt;.wav + experiment-&lt;ts&gt;.json</text>
    <g>
      <rect x="756" y="664" width="12" height="18" fill="#c9c9c9"/>
      <rect x="772" y="656" width="12" height="26" fill="#c9c9c9"/>
      <rect x="788" y="640" width="12" height="42" fill="#1f5fa8"/>
      <rect x="804" y="660" width="12" height="22" fill="#c9c9c9"/>
      <rect x="820" y="668" width="12" height="14" fill="#c9c9c9"/>
      <line x1="748" y1="682" x2="840" y2="682" stroke="#999" stroke-width="1"/>
      <line x1="794" y1="636" x2="794" y2="652" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="794" y="630" text-anchor="middle" font-size="10.5" fill="#1a1a1a">peak</text>
      <text x="822" y="704" text-anchor="middle" font-size="10.5" fill="#8a8a8a">dominant frequency</text>
    </g>

    <!-- honesty footer -->
    <line x1="46" y1="752" x2="914" y2="752" stroke="#d8d8d8" stroke-width="1"/>
    <text x="46" y="776" font-size="12" fill="#8a8a8a" letter-spacing="2.5">CURRENT STATE</text>
    <text x="46" y="798" font-size="13" fill="#5a5a5a">Experiment, measurement-first: DSP primitives are JVM-unit-tested; capture path runs on-device; CI builds on GitHub Actions.</text>
    <text x="46" y="822" font-size="12" fill="#8a8a8a" letter-spacing="2.5">FIRST MILESTONE</text>
    <text x="46" y="844" font-size="13" fill="#5a5a5a">Recover known 100, 200, and 440 Hz tones within ~2% on three consecutive captures from a responsive visible</text>
    <text x="46" y="862" font-size="13" fill="#5a5a5a">target (foil, paper, thin packaging, cup wall, speaker cone) on a regular Android phone.</text>
    <text x="46" y="890" font-size="12" fill="#8a8a8a" letter-spacing="2.5">SCIENTIFIC BOUNDARY</text>
    <text x="46" y="912" font-size="13" fill="#5a5a5a">No claim of conversation recovery. A result counts only when it survives the controls: source off, target</text>
    <text x="46" y="930" font-size="13" fill="#5a5a5a">damped, rigid-background ROI, repeated captures, source-frequency changes. See TESTING.md.</text>
    <text x="914" y="956" text-anchor="end" font-size="11.5" fill="#aaa">SonicSight · figure from the research notes</text>
  </g>
</svg>
